name: Update Scholar & ResearchGate numbers

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch:        # lets you run it any time from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest profile numbers
        run: python scripts/update_profiles.py
      - name: Save changes
        run: |
          if git diff --quiet -- profiles.json; then
            echo "Nothing changed."
          else
            git config user.name "profile-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profiles.json
            git commit -m "Update Scholar/ResearchGate numbers"
            git push
          fi
