<style>
:root{--paper:#F2F0EA;--panel:#FBFAF7;--ink:#1D1B16;--ink-2:#545046;--ink-3:#84806F;--line:#D8D4C8;--line-2:#C7C2B2;--clay:#9C5B36;--accent:#1F6B58;--accent-soft:rgba(31,107,88,.10);--bad:#B4402A;--r:14px;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55}
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.top .in{max-width:1240px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-family:var(--display);font-weight:600;font-size:1.05rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;color:var(--ink-3);margin-left:.5rem;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:.82rem;font-weight:600;border-radius:999px;padding:.45rem .95rem;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.layout{max-width:1240px;margin:0 auto;padding:1.4rem 16px 3rem;display:grid;grid-template-columns:270px minmax(0,1fr);gap:1.6rem;align-items:start}
.side{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto;padding-right:.3rem}
.ng{margin-bottom:1rem}

.ng a{display:block;font-size:.86rem;color:var(--ink-2);text-decoration:none;padding:.32rem .6rem;border-radius:8px;border-left:2px solid transparent}

@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}#pick{display:block;width:100%;font:inherit;font-size:.92rem;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);margin-bottom:1rem}}
#panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.6rem}
.grp{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#panel h1{font-family:var(--display);font-size:1.7rem;font-weight:600;line-height:1.2;margin:.25rem 0 .35rem}
.desc{color:var(--ink-2);font-size:.92rem;margin-bottom:1.2rem;max-width:62ch}

<body>
<header class="top"><div class="in">
  <a class="brand" href="./">Ashutosh Dwivedi<small>Calculators</small></a>
  <a class="btn" href="./#tools">← Back to tools</a>
</div></header>
<div class="layout">
  <div class="side"><input id="search" type="search" placeholder="Search calculators…" aria-label="Search calculators"><nav id="nav" aria-label="Calculators"></nav></div>
  <div>
    <select id="pick" aria-label="Choose a calculator"></select>
    <section id="panel"></section>
    <p class="foot"><span id="count"></span> calculators. Results update as you type and are calculated in your browser — nothing is sent anywhere. Always double-check results that matter (loans, structural quantities, health) with a professional.</p>
  </div>
</div>
<script>
/* ===== helpers ===== */
const H = (() => {
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b){ [a, b] = [b, a % b]; } return a; };
  const lcm = (a, b) => a && b ? Math.abs(a * b) / gcd(a, b) : 0;
  const f = (v, d = 6) => !isFinite(v) ? '—' : Math.abs(v) >= 1e15 || (Math.abs(v) < 1e-6 && v !== 0) ? v.toExponential(4) : (+v.toFixed(d)).toLocaleString('en-US', { maximumFractionDigits: d });
  const money = v => isFinite(v) ? v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '—';
  /* parse "3", "-2.5", "3/4", "1 1/2", "1¾" into {n,d} exact fraction */
  const frac = s => { s = String(s).trim().replace(/−/g, '-'); if (s === '') throw 'Please fill in every value.';
    let m;
    if ((m = s.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/))){ const d = +m[4]; if (!d) throw 'Denominator cannot be 0.'; const n = (+m[2]) * d + (+m[3]); return norm({ n: m[1] ? -n : n, d }); }
    if ((m = s.match(/^(-?\d+)\/(-?\d+)$/))){ if (!+m[2]) throw 'Denominator cannot be 0.'; return norm({ n: +m[1], d: +m[2] }); }
    if ((m = s.match(/^(-?)(\d*)\.(\d+)$/))){ const d = 10 ** m[3].length; const n = (+(m[2] || 0)) * d + (+m[3]); return norm({ n: m[1] ? -n : n, d }); }
    if (/^-?\d+$/.test(s)) return { n: +s, d: 1 };
    if (/^-?\d*\.?\d+e[-+]?\d+$/i.test(s)){ const v = +s; return toFrac(v); }
    throw '“' + s + '” is not a number or fraction.'; };
  const norm = q => { if (q.d < 0){ q.n = -q.n; q.d = -q.d; } const g = gcd(q.n, q.d) || 1; return { n: q.n / g, d: q.d / g }; };
  const toFrac = (x, maxD = 1e6) => { if (Number.isInteger(x)) return { n: x, d: 1 }; let h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = x;
    for (let i = 0; i < 64; i++){ const a = Math.floor(b); [h1, h2] = [a * h1 + h2, h1]; [k1, k2] = [a * k1 + k2, k1]; if (k1 > maxD || Math.abs(x - h1 / k1) < 1e-12) break; b = 1 / (b - a); }
    return norm({ n: h1, d: k1 }); };
  const fs = q => q.d === 1 ? String(q.n) : q.n + '/' + q.d;
  const mixed = q => { if (q.d === 1 || Math.abs(q.n) < q.d) return fs(q); const w = Math.trunc(q.n / q.d), r = Math.abs(q.n % q.d); return w + ' ' + r + '/' + q.d; };
  const num = (s, name) => { const v = typeof s === 'number' ? s : (s === '' || s == null ? NaN : (() => { try { const q = frac(s); return q.n / q.d; } catch(e){ return NaN; } })()); if (!isFinite(v)) throw (name || 'Each value') + ' must be a number.'; return v; };
  const pos = (v, n) => { if (!(v > 0)) throw n + ' must be greater than 0.'; return v; };
  const list = s => (String(s).match(/-?\d*\.?\d+(e[-+]?\d+)?/gi) || []).map(Number);
  /* ratio of any numbers (decimals / fractions) -> smallest whole-number ratio */
  const ratioInts = parts => { const qs = parts.map(frac); const L = qs.reduce((a, q) => lcm(a, q.d), 1); let ints = qs.map(q => q.n * (L / q.d)); const g = ints.reduce((a, v) => gcd(a, v), 0) || 1; return { ints: ints.map(v => v / g), L, g, qs }; };
  const tiles = arr => `<div class="res">${arr.map(a => `<div><b>${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div>`;
  const steps = arr => `<details class="steps" open><summary>How it’s calculated</summary><ol>${arr.map(s => `<li>${s}</li>`).join('')}</ol></details>`;
  const table = (head, rows) => `<table class="at"><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isPrime = n => { if (n < 2 || !Number.isInteger(n)) return false; if (n % 2 === 0) return n === 2; for (let i = 3; i * i <= n; i += 2) if (n % i === 0) return false; return true; };
  const factorize = n => { const out = []; let x = n; for (let p = 2; p * p <= x; p++) while (x % p === 0){ out.push(p); x /= p; } if (x > 1) out.push(x); return out; };
  return { gcd, lcm, f, money, frac, fs, mixed, toFrac, num, pos, list, ratioInts, tiles, steps, table, esc, isPrime, factorize, norm };
})();

/* unit tables (factor to base unit) */
const UNITS = {
  Length: { base: 'm', u: { 'mm': 1e-3, 'cm': 1e-2, 'm': 1, 'km': 1e3, 'in': 0.0254, 'ft': 0.3048, 'yd': 0.9144, 'mi': 1609.344, 'nmi': 1852, 'µm': 1e-6 } },
  Area: { base: 'm²', u: { 'mm²': 1e-6, 'cm²': 1e-4, 'm²': 1, 'ha': 1e4, 'km²': 1e6, 'in²': 6.4516e-4, 'ft²': 0.09290304, 'yd²': 0.83612736, 'acre': 4046.8564224, 'mi²': 2589988.110336 } },
  Volume: { base: 'L', u: { 'mL': 1e-3, 'L': 1, 'm³': 1000, 'cm³': 1e-3, 'in³': 0.016387064, 'ft³': 28.316846592, 'yd³': 764.554857984, 'US gal': 3.785411784, 'UK gal': 4.54609, 'US cup': 0.2365882365, 'US fl oz': 0.0295735295625, 'tbsp': 0.01478676478125, 'tsp': 0.00492892159375 } },
  Mass: { base: 'kg', u: { 'mg': 1e-6, 'g': 1e-3, 'kg': 1, 'tonne': 1000, 'oz': 0.028349523125, 'lb': 0.45359237, 'stone': 6.35029318, 'US ton': 907.18474, 'quintal': 100 } },
  Pressure: { base: 'Pa', u: { 'Pa': 1, 'kPa': 1e3, 'MPa': 1e6, 'GPa': 1e9, 'bar': 1e5, 'atm': 101325, 'psi': 6894.757293168, 'ksi': 6894757.293168, 'mmHg': 133.322387415, 'kgf/cm²': 98066.5, 'N/mm²': 1e6 } },
  Speed: { base: 'm/s', u: { 'm/s': 1, 'km/h': 1 / 3.6, 'mph': 0.44704, 'ft/s': 0.3048, 'knot': 0.514444444 } },
  Energy: { base: 'J', u: { 'J': 1, 'kJ': 1e3, 'MJ': 1e6, 'Wh': 3600, 'kWh': 3.6e6, 'cal': 4.184, 'kcal': 4184, 'BTU': 1055.05585262, 'eV': 1.602176634e-19 } },
  Power: { base: 'W', u: { 'W': 1, 'kW': 1e3, 'MW': 1e6, 'hp (mech.)': 745.69987158, 'hp (metric)': 735.49875, 'BTU/h': 0.29307107 } },
  Force: { base: 'N', u: { 'N': 1, 'kN': 1e3, 'MN': 1e6, 'kgf': 9.80665, 'lbf': 4.4482216152605, 'dyne': 1e-5, 'kip': 4448.2216152605 } },
  Density: { base: 'kg/m³', u: { 'kg/m³': 1, 'g/cm³': 1000, 'g/mL': 1000, 'kg/L': 1000, 'lb/ft³': 16.01846337, 'lb/in³': 27679.9047 } },
  'Data storage': { base: 'B', u: { 'bit': 0.125, 'B': 1, 'KB': 1e3, 'MB': 1e6, 'GB': 1e9, 'TB': 1e12, 'KiB': 1024, 'MiB': 1048576, 'GiB': 1073741824, 'TiB': 1099511627776 } },
  Time: { base: 's', u: { 'ms': 1e-3, 's': 1, 'min': 60, 'h': 3600, 'day': 86400, 'week': 604800, 'year (365 d)': 31536000 } },
  Angle: { base: 'deg', u: { 'deg': 1, 'rad': 180 / Math.PI, 'grad': 0.9, 'arcmin': 1 / 60, 'arcsec': 1 / 3600, 'turn': 360 } }
};

const SEL = (arr) => arr.map(x => Array.isArray(x) ? x : [x, x]);
const { f, money, tiles, steps, table, num, pos, frac, fs, mixed, gcd, lcm, list, esc } = H;
const pct = v => isFinite(v) ? H.f(v, 4) + ' %' : '—';

const CATS = [
  ['ratio', 'Ratios & proportions'], ['math', 'Math & fractions'], ['percent', 'Percentages'], ['stats', 'Statistics'], ['algebra', 'Algebra'],
  ['geometry', 'Geometry'], ['finance', 'Finance & business'], ['fratio', 'Financial ratios'], ['construction', 'Construction'], ['physics', 'Physics & chemistry'],
  ['convert', 'Unit conversions'], ['time', 'Time & date'], ['health', 'Health'], ['random', 'Random & probability'], ['tech', 'Technology']
];

const HUB = [];
const add = (cat, id, t, d, fields, run) => HUB.push({ cat, id, t, d, fields, run });

/* ================= RATIOS ================= */
add('ratio', 'ratio-solver', 'Ratio solver (A : B = C : D)', 'Leave exactly one box empty to solve for it. Works with whole numbers, decimals and fractions.',
  [['a', 'A', '3', 'text'], ['b', 'B', '4', 'text'], ['c', 'C', '6', 'text'], ['d', 'D', '', 'text']],
  v => { const keys = ['a', 'b', 'c', 'd'], empty = keys.filter(k => String(v[k]).trim() === '');
    if (empty.length !== 1) throw 'Leave exactly one of A, B, C, D empty.';
    const x = {}; keys.forEach(k => { if (k !== empty[0]) x[k] = num(v[k], k.toUpperCase()); });
    let r, s; const k = empty[0];
    if (k === 'a'){ r = x.b * x.c / x.d; s = `A = B × C ÷ D = ${f(x.b)} × ${f(x.c)} ÷ ${f(x.d)}`; }
    if (k === 'b'){ r = x.a * x.d / x.c; s = `B = A × D ÷ C = ${f(x.a)} × ${f(x.d)} ÷ ${f(x.c)}`; }
    if (k === 'c'){ r = x.a * x.d / x.b; s = `C = A × D ÷ B = ${f(x.a)} × ${f(x.d)} ÷ ${f(x.b)}`; }
    if (k === 'd'){ r = x.b * x.c / x.a; s = `D = B × C ÷ A = ${f(x.b)} × ${f(x.c)} ÷ ${f(x.a)}`; }
    if (!isFinite(r)) throw 'That ratio has a zero where it divides — check your values.';
    x[k] = r; return tiles([[f(r), k.toUpperCase() + ' ='], [`${f(x.a)} : ${f(x.b)} = ${f(x.c)} : ${f(x.d)}`, 'Completed proportion']]) + steps(['Cross-multiply: A × D = B × C.', s + ' = ' + f(r)]); });
add('ratio', 'ratio-simplify', 'Ratio simplifier', 'Reduce a ratio of 2 or more terms to lowest terms. Separate terms with a colon, e.g. 2.5 : 1 1/2 : 10.',
  [['r', 'Ratio', '24 : 36 : 60', 'text']],
  v => { const parts = String(v.r).split(/[:;,]|\bto\b/).map(s => s.trim()).filter(Boolean); if (parts.length < 2) throw 'Enter at least two terms separated by “:”.';
    const R = H.ratioInts(parts); if (R.ints.every(x => x === 0)) throw 'All terms are zero.';
    const st = []; if (R.L > 1) st.push(`Clear decimals/fractions: multiply every term by ${R.L} → ${R.qs.map(q => f(q.n * (R.L / q.d))).join(' : ')}`);
    st.push(`Greatest common factor = ${R.g}; divide each term by ${R.g}.`);
    const total = R.ints.reduce((a, b) => a + b, 0);
    return tiles([[R.ints.join(' : '), 'Simplest form'], [R.ints.map(x => f(x / R.ints[0], 4)).join(' : '), 'As 1 : n'], [R.ints.map(x => f(x / total * 100, 2) + '%').join(' / '), 'Share of total']]) + steps(st); });
add('ratio', 'ratio-fraction', 'Ratio to fraction', 'Convert a ratio A : B to fractions — part-to-part and part-to-whole.',
  [['a', 'A', '6', 'text'], ['b', 'B', '9', 'text']],
  v => { const R = H.ratioInts([v.a, v.b]), [a, b] = R.ints, t = a + b;
    return tiles([[`${a}/${b}`, 'A ÷ B (part to part)'], [H.mixed(H.norm({ n: a, d: b })), 'Mixed number'], [`${a}/${t}`, 'A as part of whole'], [`${b}/${t}`, 'B as part of whole'], [f(a / b), 'Decimal A ÷ B']]) +
      steps([`Simplify ${v.a} : ${v.b} → ${a} : ${b}`, `Whole = ${a} + ${b} = ${t}`]); });
add('ratio', 'ratio-percent', 'Ratio to percentage', 'Express each part of a ratio as a percentage of the whole.',
  [['r', 'Ratio', '3 : 5 : 2', 'text']],

add('math', 'fraction-ops', 'Fractions (+ − × ÷)', 'Add, subtract, multiply or divide fractions and mixed numbers (e.g. 1 1/2, 3/4, 0.25).',
  [['a', 'First fraction', '1 1/2', 'text'], ['op', 'Operation', '+', 'sel', SEL(['+', '−', '×', '÷'])], ['b', 'Second fraction', '3/4', 'text']],
  v => { const a = frac(v.a), b = frac(v.b); let n, d;
    if (v.op === '+'){ n = a.n * b.d + b.n * a.d; d = a.d * b.d; } else if (v.op === '−'){ n = a.n * b.d - b.n * a.d; d = a.d * b.d; } else if (v.op === '×'){ n = a.n * b.n; d = a.d * b.d; } else { if (!b.n) throw 'Cannot divide by zero.'; n = a.n * b.d; d = a.d * b.n; }
    const r = H.norm({ n, d }); return tiles([[fs(r), 'Simplified fraction'], [mixed(r), 'Mixed number'], [f(r.n / r.d), 'Decimal']]); });

  [['n', 'Numerator', 84], ['d', 'Denominator', 126]],

add('math', 'prime', 'Prime check & prime factorization', 'Is it prime? Its prime factors and all divisors.',
  [['n', 'Whole number', 360]],
  v => { const n = Math.round(v.n); if (n < 2 || n > 1e12) throw 'Enter a whole number from 2 to 10¹².'; const fac = H.factorize(n), cnt = {}; fac.forEach(p => cnt[p] = (cnt[p] || 0) + 1);
    const pf = Object.keys(cnt).map(p => cnt[p] > 1 ? `${p}<sup>${cnt[p]}</sup>` : p).join(' × ');
    let divs = []; if (n <= 1e9){ for (let i = 1; i * i <= n; i++) if (n % i === 0){ divs.push(i); if (i * i !== n) divs.push(n / i); } divs.sort((a, b) => a - b); }
    return tiles([[H.isPrime(n) ? 'Prime' : 'Composite', 'Result'], [pf, 'Prime factorization'], [divs.length || '—', 'Number of divisors']]) + (divs.length && divs.length <= 200 ? `<p class="note">Divisors: ${divs.join(', ')}</p>` : ''); });

add('math', 'round', 'Rounding numbers', 'Round to decimal places, significant figures or the nearest multiple.',

    return tiles([[f(r, 12), 'Rounded'], [f(v.mode === 'm' ? Math.floor(x / v.k) * v.k : Math.floor(x * 10 ** v.k) / 10 ** v.k, 12), 'Rounded down'], [f(v.mode === 'm' ? Math.ceil(x / v.k) * v.k : Math.ceil(x * 10 ** v.k) / 10 ** v.k, 12), 'Rounded up']]); });
add('math', 'sigfig', 'Significant figures counter', 'Count significant figures in a number as written.',

add('math', 'factorial', 'Factorial, permutations & combinations', 'n!, nPr and nCr.',
  [['n', 'n', 10], ['r', 'r', 3]],
  v => { const n = Math.round(v.n), r = Math.round(v.r); if (n < 0 || r < 0 || r > n) throw 'Need 0 ≤ r ≤ n (whole numbers).'; if (n > 170) throw 'n must be ≤ 170.';
    const fact = k => { let x = 1; for (let i = 2; i <= k; i++) x *= i; return x; }; let P = 1; for (let i = n - r + 1; i <= n; i++) P *= i; let C = 1; for (let i = 1; i <= r; i++) C = C * (n - r + i) / i;
    return tiles([[f(fact(n), 0), 'n!'], [f(P, 0), 'nPr (order matters)'], [f(Math.round(C), 0), 'nCr (order doesn’t matter)'], [f(Math.pow(n, r), 0), 'n^r (with repetition)']]); });
add('math', 'roman', 'Roman numerals', 'Convert between numbers (1–3999) and Roman numerals.',
  [['x', 'Number or Roman numeral', '2026', 'text']],
  v => { const s = String(v.x).trim().toUpperCase(), M = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    if (/^\d+$/.test(s)){ let n = +s; if (n < 1 || n > 3999) throw 'Enter 1 to 3999.'; let r = ''; M.forEach(([k, l]) => { while (n >= k){ r += l; n -= k; } }); return tiles([[r, 'Roman numeral']]); }
    if (!/^[MDCLXVI]+$/.test(s)) throw 'Enter a number or a Roman numeral.'; let i = 0, n = 0; M.forEach(([k, l]) => { while (s.startsWith(l, i)){ n += k; i += l.length; } }); if (i !== s.length) throw 'Not a valid Roman numeral.'; return tiles([[n, 'Number']]); });
add('math', 'words', 'Numbers to words', 'Write a number in words (international and Indian systems).',
  [['x', 'Number', '1234567.89', 'text']],
  v => { const x = num(v.x); if (Math.abs(x) >= 1e15) throw 'Number too large.'; const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'], tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const h = n => { let s = ''; if (n >= 100){ s += ones[Math.floor(n / 100)] + ' hundred'; n %= 100; if (n) s += ' '; } if (n >= 20){ s += tens[Math.floor(n / 10)]; if (n % 10) s += '-' + ones[n % 10]; } else if (n) s += ones[n]; return s; };
    const intl = n => { if (!n) return 'zero'; const sc = ['', ' thousand', ' million', ' billion', ' trillion']; let out = [], i = 0; while (n > 0){ const c = n % 1000; if (c) out.unshift(h(c) + sc[i]); n = Math.floor(n / 1000); i++; } return out.join(' '); };
    const ind = n => { if (!n) return 'zero'; const parts = []; const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1000); n %= 1000;
      if (cr) parts.push((cr >= 1000 ? intl(cr) : h(cr)) + ' crore'); if (lk) parts.push(h(lk) + ' lakh'); if (th) parts.push(h(th) + ' thousand'); if (n) parts.push(h(n)); return parts.join(' '); };
    const neg = x < 0, a = Math.abs(x), w = Math.floor(a), dec = String(v.x).split('.')[1];
    const tail = dec ? ' point ' + dec.replace(/\D/g, '').split('').map(d => ones[+d] || 'zero').join(' ') : '';
    return tiles([[(neg ? 'minus ' : '') + intl(w) + tail, 'International'], [(neg ? 'minus ' : '') + ind(w) + tail, 'Indian (lakh / crore)'], [w.toLocaleString('en-IN'), 'Indian digit grouping']]); });

  v => { const p = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; }; let d = p(v.b) - p(v.a); if (d < 0) d += 1440; d -= v.br; if (d < 0) throw 'Break is longer than the time worked.';
    return tiles([[Math.floor(d / 60) + ' h ' + (d % 60) + ' min', 'Duration'], [f(d / 60, 4), 'Decimal hours'], [f(d, 0), 'Minutes']]); });
add('time', 'time-decimal', 'Time ↔ decimal hours', 'Convert h:mm:ss to decimal hours and back.', [['t', 'Time (h:mm:ss)', '2:45:30', 'text'], ['d', 'Decimal hours (optional)', '']],
  v => { const p = String(v.t).split(':').map(Number); if (p.some(x => !isFinite(x))) throw 'Use the format h:mm or h:mm:ss.'; const dec = (p[0] || 0) + (p[1] || 0) / 60 + (p[2] || 0) / 3600; const out = [[f(dec, 6), 'Decimal hours'], [f(dec * 60, 4), 'Minutes']];
    if (v.d !== '' && isFinite(v.d)){ const h = Math.floor(v.d), mm = Math.floor((v.d - h) * 60), ss = Math.round(((v.d - h) * 60 - mm) * 60); out.push([`${h}:${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`, f(v.d) + ' h as h:mm:ss']); } return tiles(out); });
add('time', 'countdown', 'Countdown to a date', 'Time left until an event.', [['d', 'Event date', '2026-12-31', 'date'], ['t', 'Event time', '00:00', 'time']],
  v => { const e = new Date(v.d + 'T' + (v.t || '00:00')), n = new Date(); if (isNaN(e)) throw 'Check the date.'; let s = Math.round((e - n) / 1000); const past = s < 0; s = Math.abs(s);
    return tiles([[`${Math.floor(s / 86400)} d ${Math.floor(s % 86400 / 3600)} h ${Math.floor(s % 3600 / 60)} min`, past ? 'Time since' : 'Time left'], [f(s / 86400, 2), 'Days']]); });
add('time', 'day-of-week', 'Day of the week', 'What day of the week any date falls on.', [['d', 'Date', today(), 'date']],
  v => { const d = new Date(v.d + 'T00:00:00'); if (isNaN(d)) throw 'Check the date.'; const start = new Date(d.getFullYear(), 0, 1); return tiles([[d.toLocaleDateString('en-GB', { weekday: 'long' }), 'Day'], [Math.round((d - start) / 864e5) + 1, 'Day of the year']]); });

/* ================= HEALTH ================= */
add('health', 'bmi', 'BMI (body mass index)', 'BMI from weight and height, with the WHO category.', [['w', 'Weight (kg)', 70], ['h', 'Height (cm)', 175]],
  v => { pos(v.h, 'Height'); const b = v.w / (v.h / 100) ** 2, c = b < 18.5 ? 'Underweight' : b < 25 ? 'Normal' : b < 30 ? 'Overweight' : 'Obese'; return tiles([[f(b, 1), 'BMI'], [c, 'WHO category'], [f(18.5 * (v.h / 100) ** 2, 1) + ' – ' + f(24.9 * (v.h / 100) ** 2, 1) + ' kg', 'Healthy weight range']]); });
add('health', 'bmr', 'BMR & daily calories', 'Mifflin–St Jeor basal metabolic rate and daily energy needs.', [['sex', 'Sex', 'm', 'sel', SEL([['m', 'Male'], ['f', 'Female']])], ['age', 'Age (years)', 30], ['w', 'Weight (kg)', 70], ['h', 'Height (cm)', 175], ['act', 'Activity', '1.55', 'sel', SEL([['1.2', 'Sedentary'], ['1.375', 'Light'], ['1.55', 'Moderate'], ['1.725', 'Very active'], ['1.9', 'Extra active']])]],
  v => { const bmr = 10 * v.w + 6.25 * v.h - 5 * v.age + (v.sex === 'm' ? 5 : -161); return tiles([[f(bmr, 0) + ' kcal', 'BMR'], [f(bmr * +v.act, 0) + ' kcal', 'Daily calories']]); });
add('health', 'heart', 'Target heart rate', 'Karvonen heart-rate zones.', [['age', 'Age', 30], ['rest', 'Resting heart rate (bpm)', 65]],
  v => { const mx = 220 - v.age, r = mx - v.rest, z = p => f(v.rest + r * p, 0); return table(['Zone', 'Intensity', 'bpm'], [['Warm-up', '50–60 %', z(.5) + '–' + z(.6)], ['Fat burn', '60–70 %', z(.6) + '–' + z(.7)], ['Aerobic', '70–80 %', z(.7) + '–' + z(.8)], ['Anaerobic', '80–90 %', z(.8) + '–' + z(.9)], ['Maximum', '90–100 %', z(.9) + '–' + mx]]); });
add('health', 'water', 'Daily water intake', 'A simple guide based on body weight and activity.', [['w', 'Weight (kg)', 70], ['ex', 'Exercise (minutes / day)', 30]],
  v => tiles([[f(v.w * 0.033 + v.ex / 30 * 0.35, 2) + ' L', 'Approx. daily water']]));
add('health', 'pace', 'Running pace', 'Pace and speed from distance and time.', [['d', 'Distance (km)', 10], ['t', 'Time (h:mm:ss)', '0:52:30', 'text']],
  v => { const p = String(v.t).split(':').map(Number); const s = p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + (p[1] || 0); pos(v.d, 'Distance'); const pk = s / v.d;
    return tiles([[Math.floor(pk / 60) + ':' + String(Math.round(pk % 60)).padStart(2, '0') + ' /km', 'Pace'], [f(v.d / (s / 3600), 2) + ' km/h', 'Speed']]); });

/* ================= RANDOM & PROBABILITY ================= */
const rnd = n => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296 * n; };
add('random', 'rng', 'Random number generator', 'Random whole numbers in a range, with or without repeats.', [['lo', 'Minimum', 1], ['hi', 'Maximum', 100], ['n', 'How many', 5], ['rep', 'Allow repeats', 'no', 'sel', SEL([['no', 'No'], ['yes', 'Yes']])]],
  v => { const lo = Math.ceil(Math.min(v.lo, v.hi)), hi = Math.floor(Math.max(v.lo, v.hi)), n = Math.round(v.n), span = hi - lo + 1; if (n < 1 || n > 10000) throw 'Choose 1 to 10 000 numbers.'; if (v.rep === 'no' && n > span) throw 'Not enough numbers in the range without repeats.';
    const out = []; const seen = new Set(); while (out.length < n){ const x = lo + Math.floor(rnd(span)); if (v.rep === 'yes' || !seen.has(x)){ seen.add(x); out.push(x); } }
    return `<div class="big">${out.join(', ')}</div><p class="note">Change any value or press “Reset” to draw again. Uses your browser’s secure random generator.</p>`; });
add('random', 'coin', 'Coin flipper', 'Flip a coin up to 100 000 times and see the heads : tails ratio.', [['n', 'Number of flips', 100]],
  v => { const n = Math.round(v.n); if (n < 1 || n > 100000) throw 'Choose 1 to 100 000 flips.'; let h = 0; for (let i = 0; i < n; i++) if (rnd(2) < 1) h++; const R = H.ratioInts([String(h), String(n - h)]);
    return tiles([[h, 'Heads'], [n - h, 'Tails'], [pct(h / n * 100), 'Heads %'], [n - h && h ? R.ints.join(' : ') : '—', 'Heads : tails']]); });
add('random', 'dice', 'Dice roller', 'Roll any number of dice with any number of sides.', [['n', 'Number of dice', 2], ['s', 'Sides per die', 6]],
  v => { const n = Math.round(v.n), s = Math.round(v.s); if (n < 1 || n > 100 || s < 2) throw 'Use 1–100 dice with at least 2 sides.'; const r = Array.from({ length: n }, () => 1 + Math.floor(rnd(s))); return `<div class="big">${r.join('  ')}</div>` + tiles([[r.reduce((a, b) => a + b, 0), 'Total']]); });
add('random', 'picker', 'Random name picker', 'Pick one or more names from a list.', [['x', 'Names (one per line)', 'Asha\nRahul\nMeera\nKiran\nArjun', 'ta'], ['n', 'How many to pick', 1]],
  v => { const a = String(v.x).split('\n').map(s => s.trim()).filter(Boolean); const n = Math.round(v.n); if (!a.length) throw 'Enter some names.'; if (n < 1 || n > a.length) throw 'Pick between 1 and ' + a.length + '.';
    const c = [...a]; for (let i = c.length - 1; i > 0; i--){ const j = Math.floor(rnd(i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return `<div class="big">${c.slice(0, n).map(esc).join(', ')}</div>`; });
add('random', 'password', 'Password generator', 'Strong random password (generated in your browser, never sent anywhere).', [['n', 'Length', 16], ['sym', 'Include symbols', 'yes', 'sel', SEL([['yes', 'Yes'], ['no', 'No']])]],
  v => { const n = Math.round(v.n); if (n < 6 || n > 128) throw 'Length 6 to 128.'; const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789' + (v.sym === 'yes' ? '!@#$%^&*()-_=+[]{};:,.?' : ''); let p = ''; for (let i = 0; i < n; i++) p += cs[Math.floor(rnd(cs.length))];
    return `<div class="big mono">${esc(p)}</div>` + tiles([[f(n * Math.log2(cs.length), 0) + ' bits', 'Entropy']]); });
add('random', 'probability', 'Probability of events', 'P(A and B), P(A or B), P(not A) for independent events.', [['a', 'P(A) (0–1)', 0.4], ['b', 'P(B) (0–1)', 0.25]],
  v => { if (v.a < 0 || v.a > 1 || v.b < 0 || v.b > 1) throw 'Probabilities must be between 0 and 1.'; return tiles([[f(v.a * v.b), 'P(A and B)'], [f(v.a + v.b - v.a * v.b), 'P(A or B)'], [f(1 - v.a), 'P(not A)'], [f(v.a * (1 - v.b) + v.b * (1 - v.a)), 'P(exactly one)']]); });

/* ================= TECHNOLOGY ================= */
add('tech', 'base', 'Number base converter', 'Binary, octal, decimal and hexadecimal.', [['x', 'Number', '255', 'text'], ['from', 'From base', '10', 'sel', SEL([['2', 'Binary (2)'], ['8', 'Octal (8)'], ['10', 'Decimal (10)'], ['16', 'Hex (16)']])]],
  v => { const s = String(v.x).trim().toLowerCase().replace(/^0[xbo]/, ''); const ok = { 2: /^[01]+$/, 8: /^[0-7]+$/, 10: /^\d+$/, 16: /^[0-9a-f]+$/ }[v.from]; if (!ok.test(s)) throw 'That is not a valid base-' + v.from + ' number.';
    const n = BigInt(v.from === '10' ? s : (v.from === '16' ? '0x' : v.from === '8' ? '0o' : '0b') + s); return tiles([[n.toString(2), 'Binary'], [n.toString(8), 'Octal'], [n.toString(10), 'Decimal'], [n.toString(16).toUpperCase(), 'Hexadecimal']]); });
add('tech', 'download', 'Download time', 'Time to download a file at a given speed.', [['s', 'File size', 4], ['su', 'Size unit', 'GB', 'sel', SEL(['MB', 'GB', 'TB'])], ['r', 'Speed (Mbps)', 100]],
  v => { pos(v.r, 'Speed'); const bits = v.s * { MB: 8e6, GB: 8e9, TB: 8e12 }[v.su], t = bits / (v.r * 1e6); return tiles([[Math.floor(t / 3600) + ' h ' + Math.floor(t % 3600 / 60) + ' min ' + Math.round(t % 60) + ' s', 'Download time']]); });
add('tech', 'chars', 'Word & character counter', 'Words, characters, sentences and reading time.', [['x', 'Text', 'Paste or type your text here to count words and characters.', 'ta']],
  v => { const t = String(v.x), w = (t.match(/\S+/g) || []).length; return tiles([[w, 'Words'], [t.length, 'Characters'], [t.replace(/\s/g, '').length, 'Characters (no spaces)'], [(t.match(/[.!?]+(\s|$)/g) || []).length, 'Sentences'], [Math.max(1, Math.round(w / 230)) + ' min', 'Reading time']]); });

(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = H.esc;
const byCat = c => HUB.filter(x => x.cat === c);
function renderNav(q){
  q = (q || '').trim().toLowerCase();
  const match = x => !q || (x.t + ' ' + x.d + ' ' + x.cat).toLowerCase().includes(q);
  $('nav').innerHTML = CATS.map(([c, name]) => { const items = byCat(c).filter(match); if (!items.length) return '';
    return `<div class="ng" id="g-${c}"><p>${esc(name)} <span>${items.length}</span></p>${items.map(x => `<a href="#${x.id}" data-id="${x.id}">${esc(x.t)}</a>`).join('')}</div>`; }).join('') || '<p class="note">No calculator matches.</p>';
  const cur = location.hash.slice(1); document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === cur));
}
$('pick').innerHTML = CATS.map(([c, n]) => `<optgroup label="${esc(n)}">${byCat(c).map(x => `<option value="${x.id}">${esc(x.t)}</option>`).join('')}</optgroup>`).join('');
$('pick').addEventListener('change', e => { location.hash = e.target.value; });
$('search').addEventListener('input', e => renderNav(e.target.value));
$('count').textContent = HUB.length;
function home(){
  document.querySelectorAll('#nav a').forEach(a => a.classList.remove('on'));
  $('panel').innerHTML = `<p class="grp">Calculators</p><h1>${HUB.length} free calculators</h1><p class="desc">Pick a category or search on the left. Ratio calculators are first. Everything runs in your browser.</p>
    <div class="cats">${CATS.map(([c, n]) => `<a class="cat" href="#${byCat(c)[0].id}"><b>${esc(n)}</b><span>${byCat(c).length} calculators</span><small>${byCat(c).slice(0, 4).map(x => esc(x.t)).join(' · ')}${byCat(c).length > 4 ? ' …' : ''}</small></a>`).join('')}</div>`;
  document.title = 'Calculators — ' + HUB.length + ' free online calculators';
}
function show(id){
  const c = HUB.find(x => x.id === id); if (!c) return home();
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.id === c.id)); $('pick').value = c.id;
  const catName = (CATS.find(k => k[0] === c.cat) || [, ''])[1];
  $('panel').innerHTML = `<p class="grp"><a href="#" id="toHome">Calculators</a> › ${esc(catName)}</p><h1>${esc(c.t)}</h1><p class="desc">${esc(c.d)}</p>
    <form id="cf" class="cgrid" autocomplete="off">${c.fields.map(fl => {
      const [k, lab, val, type, opts] = fl;
      if (type === 'ta') return `<label class="wide">${esc(lab)}<textarea name="${k}" rows="4">${esc(val)}</textarea></label>`;
      if (type === 'sel') return `<label>${esc(lab)}<select name="${k}">${opts.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(val) ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
      const t = type === 'text' ? 'text' : type === 'date' ? 'date' : type === 'time' ? 'time' : 'number';
      return `<label>${esc(lab)}<input name="${k}" type="${t}"${t === 'number' ? ' step="any"' : ''} value="${esc(val)}"></label>`; }).join('')}</form>
    <div class="out" id="out" aria-live="polite"></div>
    <div class="acts"><button class="btn" type="button" id="reset">Reset</button><button class="btn" type="button" id="copy">Copy results</button></div>`;
  $('toHome').addEventListener('click', e => { e.preventDefault(); history.pushState('', '', location.pathname); home(); });
  const form = $('cf');
  const go = () => { const v = {}; c.fields.forEach(fl => { const el = form.elements[fl[0]]; const t = fl[3];
      v[fl[0]] = (t === 'text' || t === 'ta' || t === 'sel' || t === 'date' || t === 'time') ? el.value : (el.value === '' ? '' : +el.value); });
    try { $('out').innerHTML = c.run(v); } catch(e){ $('out').innerHTML = '<p class="err">' + esc(typeof e === 'string' ? e : 'Please check the values.') + '</p>'; if (typeof e !== 'string') console.error(e); } };
  form.addEventListener('input', go); form.addEventListener('submit', e => e.preventDefault());
  $('reset').addEventListener('click', () => show(c.id));
  $('copy').addEventListener('click', () => { const t = c.t + '\n' + $('out').innerText; if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy results', 1400); }).catch(() => {}); });
  go(); document.title = c.t + ' — Calculators';
  if (window.innerWidth < 900) $('panel').scrollIntoView({ block: 'start' });
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
renderNav(''); show(location.hash.slice(1));
})();
</script>
